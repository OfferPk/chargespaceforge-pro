<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#050a14"/>
  <rect x="20" y="20" width="760" height="410" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="40" y="55" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="bold">ChargeSpaceForge Pro v1.0.0 — Spacecraft Charging &amp; ESD Mitigation Architecture</text>
  <text x="40" y="78" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="12">NASA-HDBK-4002A • ECSS-E-ST-20-06C • NASA-STD-4010 • ISO 19923:2017</text>

  <!-- Surface Charging Block -->
  <rect x="40" y="105" width="220" height="140" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="55" y="130" fill="#38bdf8" font-family="Inter, sans-serif" font-size="13" font-weight="bold">1. SURFACE CHARGING (PLASMA)</text>
  <text x="55" y="152" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10">• GEO Substorm: Te=12keV, ne=1.2</text>
  <text x="55" y="172" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10">• Photoemission: ~30 µA/m²</text>
  <text x="55" y="192" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10">• Diff Potential: ΔV ≤ 500 V</text>
  <text x="55" y="212" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="10">• Chassis Limit: |V_ch| ≤ 2000 V</text>

  <!-- Deep Dielectric Charging Block -->
  <rect x="290" y="105" width="220" height="140" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="305" y="130" fill="#34d399" font-family="Inter, sans-serif" font-size="13" font-weight="bold">2. DEEP DIELECTRIC (E &gt; 1 MeV)</text>
  <text x="305" y="152" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10">• Killer Electron Penetration</text>
  <text x="305" y="172" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10">• Internal Flux: J_int ≤ 0.10 pA/cm²</text>
  <text x="305" y="192" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10">• Electric Field: E_int ≤ 2.0 MV/m</text>
  <text x="305" y="212" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10">• Breakdown Safety: 5x Margin</text>

  <!-- Solar Array & ESD Safety Block -->
  <rect x="540" y="105" width="220" height="140" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="555" y="130" fill="#fbbf24" font-family="Inter, sans-serif" font-size="13" font-weight="bold">3. SOLAR ARRAY &amp; ESD ARCS</text>
  <text x="555" y="152" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10">• Inverted Gradient: ≤ 200 V</text>
  <text x="555" y="172" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10">• Secondary Arc Tracking Guard</text>
  <text x="555" y="192" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10">• MLI Bonding: R_bond ≤ 10 Ω</text>
  <text x="555" y="212" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="10">• Isolated Metal: A_iso ≤ 0.30 cm²</text>

  <!-- Lower Section: 10-Point Normative Auditor -->
  <rect x="40" y="270" width="720" height="140" rx="8" fill="#090e1c" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="298" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="13" font-weight="bold">10-POINT NORMATIVE VERIFICATION ENGINE (10 / 10 PASS — 100% NASA/ECSS/ISO CERTIFIED)</text>
  <g font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">
    <text x="55" y="325"><tspan fill="#34d399">[PASS]</tspan> CHG-01: Differential Surface Potential (ΔV ≤ 500 V)</text>
    <text x="55" y="345"><tspan fill="#34d399">[PASS]</tspan> CHG-02: Absolute Chassis Potential (|V_chassis| ≤ 2000 V)</text>
    <text x="55" y="365"><tspan fill="#34d399">[PASS]</tspan> CHG-03: Internal Electric Field (E_int ≤ 2.0 MV/m, 5x Margin)</text>
    <text x="55" y="385"><tspan fill="#34d399">[PASS]</tspan> CHG-04: Deposited Electron Flux (J_int ≤ 0.10 pA/cm²)</text>
    <text x="55" y="405"><tspan fill="#34d399">[PASS]</tspan> CHG-05: Solar Array Inverted Potential Gradient (≤ 200 V)</text>

    <text x="420" y="325"><tspan fill="#34d399">[PASS]</tspan> CHG-06: Solar Array Secondary Arc Tracking Elimination</text>
    <text x="420" y="345"><tspan fill="#34d399">[PASS]</tspan> CHG-07: Static Dissipative Surface Resistivity (≤ 10⁹ Ω/sq)</text>
    <text x="420" y="365"><tspan fill="#34d399">[PASS]</tspan> CHG-08: Multi-Layer Insulation (MLI) Grounding (≤ 10 Ω)</text>
    <text x="420" y="385"><tspan fill="#34d399">[PASS]</tspan> CHG-09: Maximum Isolated Floating Metal Area (≤ 0.30 cm²)</text>
    <text x="420" y="405"><tspan fill="#34d399">[PASS]</tspan> CHG-10: Structural Charge Bleed-off &amp; Grounding Architecture</text>
  </g>
</svg>